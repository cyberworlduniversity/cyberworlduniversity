<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-label="Animated circular profile photo of E HEMANATHAN">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00D084"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="photoClip"><circle cx="280" cy="280" r="175"/></clipPath>
  </defs>
  <rect width="560" height="560" fill="transparent"/>
  <g filter="url(#glow)">
    <circle cx="280" cy="280" r="205" fill="none" stroke="url(#ring)" stroke-width="7" stroke-dasharray="22 12">
      <animateTransform attributeName="transform" type="rotate" from="0 280 280" to="360 280 280" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="280" r="222" fill="none" stroke="#00F7FF" stroke-width="3" stroke-dasharray="3 18">
      <animateTransform attributeName="transform" type="rotate" from="360 280 280" to="0 280 280" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="280" cy="280" r="190" fill="#07111f" stroke="url(#ring)" stroke-width="10"/>
  <!-- GitHub README-safe relative image reference -->
  <image x="105" y="105" width="350" height="350" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoClip)" href="./E%20HEMANATHAN.png"/>
  <circle cx="280" cy="280" r="175" fill="none" stroke="#FFFFFF" stroke-width="3">
    <animate attributeName="stroke-opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <g fill="#00F7FF">
    <circle cx="280" cy="50" r="7"><animate attributeName="opacity" values="1;.15;1" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="280" r="6"><animate attributeName="opacity" values=".15;1;.15" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="510" r="7"><animate attributeName="opacity" values="1;.15;1" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="280" r="6"><animate attributeName="opacity" values=".15;1;.15" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
